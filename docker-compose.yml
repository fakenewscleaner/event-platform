x-app: &app
  image: event-platform-app:local
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    DB_CONNECTION: pgsql
    DB_URL: ""
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-event_platform}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    APP_TIMEZONE: UTC
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
  volumes:
    - app_storage:/var/www/html/storage

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-event_platform}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    <<: *app
    command: [initialize]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      additional_contexts:
        app-image: service:app
      args:
        APP_IMAGE: app-image
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *app
    command: [php, artisan, queue:work, --sleep=3, --tries=3, --timeout=60]
    depends_on:
      init:
        condition: service_completed_successfully
    stop_grace_period: 90s
    restart: unless-stopped

  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db_data:
  app_storage:
